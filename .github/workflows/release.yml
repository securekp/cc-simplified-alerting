name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run lint
      # Not in the Cribl-Community template, but this app's own gate: every rule that keeps it
      # from authoring an alert that cannot fire is covered by a test, so a release that skipped
      # them would be a release with no evidence behind it.
      - run: npm test
      - run: npm run package -- --version "$(echo ${GITHUB_REF_NAME#v} | sed s/-staging$//)"

      - name: Publish pack layout for Git install
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/prepare-git-pack.mjs --version "${GITHUB_REF_NAME#v}"
          git add -f static default package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): add Cribl pack layout for Git install"
            git tag -f "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}" --force
          fi
          git tag -f latest "${GITHUB_REF_NAME}"
          git push origin latest --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true

      # --- Marketplace publishing, deliberately disabled -----------------------
      #
      # These two steps are the Cribl-Community template's dispensary upload, and they are
      # commented out on purpose: the release stops at the GitHub Release above, so a `v*` tag
      # produces a downloadable .tgz and nothing is published to the Cribl Marketplace.
      #
      # They depend on org-level secrets and variables (`PACKS_API_TOKEN`, `DISPENSARY_ENDPOINT`,
      # and the `_STAGING` pair) that exist on the `Cribl-Community` org and nowhere else. Left
      # enabled outside that org they do not fail safe — `vars.DISPENSARY_ENDPOINT` resolves to an
      # empty string, so `curl` is handed a bare path and the job fails after the release is
      # already published, which reads as a broken release rather than an unconfigured one.
      #
      # To publish to the Marketplace, uncomment both steps. Nothing else has to change: the
      # `-staging` tag suffix already routes between the two endpoints.
      #
      # - name: Upload pack to Packs Dispensary (staging)
      #   if: contains(github.ref_name, '-staging')
      #   run: |
      #     TGZ_FILE=$(find build -name '*.tgz' | head -1)
      #     if [ -z "$TGZ_FILE" ]; then echo "ERROR: No .tgz found in build/"; exit 1; fi
      #     curl --fail --location '${{ vars.DISPENSARY_ENDPOINT_STAGING }}/${{ github.event.repository.name }}' \
      #       --header 'Authorization: Bearer ${{ secrets.PACKS_API_TOKEN_STAGING }}' \
      #       --form "file=@${TGZ_FILE}"
      #
      # - name: Upload pack to Packs Dispensary (prod)
      #   if: ${{ !contains(github.ref_name, '-staging') }}
      #   run: |
      #     TGZ_FILE=$(find build -name '*.tgz' | head -1)
      #     if [ -z "$TGZ_FILE" ]; then echo "ERROR: No .tgz found in build/"; exit 1; fi
      #     curl --fail --location '${{ vars.DISPENSARY_ENDPOINT }}/${{ github.event.repository.name }}' \
      #       --header 'Authorization: Bearer ${{ secrets.PACKS_API_TOKEN }}' \
      #       --form "file=@${TGZ_FILE}"
